name: Build SuperH
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/therainbowphoenix/gint-docker:main
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/generate_tables.py
      - run: sh tools/build_sh4.sh
      - run: sh tools/build_addin.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DCC-SuperH
          path: |
            DCC-SuperH.hh3
            build-sh4/*.elf
            build-sh4/libdcc.a
